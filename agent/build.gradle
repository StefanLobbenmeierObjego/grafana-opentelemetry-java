import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
  id("com.gradleup.shadow")
  id("maven-publish")
}

apply from: "$rootDir/gradle/shadow.gradle"

def relocatePackages = ext.relocatePackages

configurations {
  // this configuration collects libs that will be placed in the bootstrap classloader
  bootstrapLibs {
    canBeResolved = true
    canBeConsumed = false
  }
  // this configuration collects libs that will be placed in the agent classloader, isolated from the instrumented application code
  javaagentLibs {
    canBeResolved = true
    canBeConsumed = false
  }
  // this configuration stores the upstream agent dep that's extended by this project
  upstreamAgent {
    canBeResolved = true
    canBeConsumed = false
  }
}

dependencies {
  javaagentLibs(project(":custom"))

  upstreamAgent("io.opentelemetry.javaagent:opentelemetry-javaagent:${versions.opentelemetryJavaagent}")
}

publishing {
  publications {
    agent(MavenPublication) {
      groupId = rootProject.group
      artifactId = rootProject.name
      version = rootProject.version

      pom {
        name = "Grafana OpenTelemetry Distribution for Java"
        description = "OpenTelemetry Java agent distribution optimized for Grafana Cloud Application Observability"
        url = "https://github.com/grafana/grafana-opentelemetry-java"
        licenses {
          license {
            name = "The Apache License, Version 2.0"
            url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
          }
        }
        scm {
          connection = "scm:git:https://github.com/grafana/grafana-opentelemetry-java.git"
          developerConnection = "scm:git:ssh://git@github.com/grafana/grafana-opentelemetry-java.git"
          url = "https://github.com/grafana/grafana-opentelemetry-java"
        }
        withXml {
          def pom = asNode()
          pom.packaging[0].value = "jar"
          def dependency = pom.appendNode("dependencies").appendNode("dependency")
          dependency.appendNode("groupId", "io.opentelemetry.javaagent")
          dependency.appendNode("artifactId", "opentelemetry-javaagent")
          dependency.appendNode("version", versions.opentelemetryJavaagent)
          dependency.appendNode("scope", "runtime")
        }
      }
    }
  }
}

def pomMetadataPath = "META-INF/maven/${rootProject.group}/${rootProject.name}"

def generatePomProperties = tasks.register("generatePomProperties", WriteProperties) {
  destinationFile = layout.buildDirectory.file("generated/pom/pom.properties")
  property("groupId", rootProject.group)
  property("artifactId", rootProject.name)
  property("version", rootProject.version)
}

CopySpec isolateClasses(Iterable<File> jars) {
  return copySpec {
    jars.forEach {
      from(zipTree(it)) {
        into("inst")
        rename("^(.*)\\.class\$", "\$1.classdata")
        exclude("^LICENSE\$")
        exclude("META-INF/INDEX.LIST")
        exclude("META-INF/*.DSA")
        exclude("META-INF/*.SF")
        exclude("META-INF/maven/**")
        exclude("META-INF/MANIFEST.MF")
      }
    }
  }
}

tasks {
  jar {
    enabled = false
  }

  // building the final javaagent jar is done in 3 steps:

  // 1. all distro specific javaagent libs are relocated
  task relocateJavaagentLibs(type: ShadowJar) {
    configurations = [project.configurations.javaagentLibs]

    archiveFileName.set("javaagentLibs-relocated.jar")

    duplicatesStrategy = DuplicatesStrategy.FAIL
    mergeServiceFiles()
    // mergeServiceFiles requires that duplicate strategy is set to include
    filesMatching("META-INF/services/**") {
      duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    exclude("**/module-info.class")
    relocatePackages(it)

    // exclude known bootstrap dependencies - they can't appear in the inst/ directory
    dependencies {
      exclude("io.opentelemetry:opentelemetry-api")
      exclude("io.opentelemetry:opentelemetry-common")
      exclude("io.opentelemetry:opentelemetry-context")
      exclude("io.opentelemetry.semconv:opentelemetry-semconv")
      exclude("io.opentelemetry.semconv:opentelemetry-semconv-incubating")
      // events API and metrics advice API
      exclude("io.opentelemetry:opentelemetry-api-incubator")
    }
  }

  // 2. the distro javaagent libs are then isolated - moved to the inst/ directory
  // having a separate task for isolating javaagent libs is required to avoid duplicates with the upstream javaagent
  // duplicatesStrategy in shadowJar won't be applied when adding files with with(CopySpec) because each CopySpec has
  // its own duplicatesStrategy
  task isolateJavaagentLibs(type: Copy) {
    dependsOn(tasks.relocateJavaagentLibs)
    with isolateClasses(tasks.relocateJavaagentLibs.outputs.files)

    into(layout.buildDirectory.dir("isolated/javaagentLibs"))
  }

  // 3. the relocated and isolated javaagent libs are merged together with the bootstrap libs (which undergo relocation
  // in this task) and the upstream javaagent jar; duplicates are removed
  shadowJar {
    configurations = [project.configurations.bootstrapLibs, project.configurations.upstreamAgent]

    dependsOn(tasks.isolateJavaagentLibs)
    dependsOn(tasks.generatePomFileForAgentPublication, generatePomProperties)
    from(tasks.isolateJavaagentLibs.outputs)
    from(tasks.generatePomFileForAgentPublication.destination) {
      into(pomMetadataPath)
      rename { "pom.xml" }
    }
    from(generatePomProperties) {
      into(pomMetadataPath)
    }

    archiveClassifier.set("all")

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles("inst/META-INF/services")
    // mergeServiceFiles requires that duplicate strategy is set to include
    filesMatching("inst/META-INF/services/**") {
      duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    exclude("**/module-info.class")
    relocatePackages(it)

    archiveFileName = "grafana-opentelemetry-java.jar"
    manifest {
      attributes.put("Main-Class", "io.opentelemetry.javaagent.OpenTelemetryAgent")
      attributes.put("Agent-Class", "io.opentelemetry.javaagent.OpenTelemetryAgent")
      attributes.put("Premain-Class", "io.opentelemetry.javaagent.OpenTelemetryAgent")
      attributes.put("Can-Redefine-Classes", "true")
      attributes.put("Can-Retransform-Classes", "true")
      attributes.put("Implementation-Vendor", "Grafana Labs")
      attributes.put("Implementation-Version", "${versions.opentelemetryJavaagent}")
    }
  }

  assemble {
    dependsOn(shadowJar)
  }
}
